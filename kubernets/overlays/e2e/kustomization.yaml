apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: otel-collector-agent-config
    files:
      - config.yaml=config.yaml
    options:
      disableNameSuffixHash: true
    behavior: replace


# add env label to all resources
labels:
  - pairs:
      env: e2e
    includeSelectors: true
    includeTemplates: true