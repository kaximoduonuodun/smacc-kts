apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-agent
spec:
  template:
    spec:
      # e2e 鏄崟鑺傜偣 K3s锛岀洿鎺ュ蹇嶆墍鏈?taint 纭繚鑳借窇
      tolerations:
        - operator: Exists
      containers:
        - name: otel-collector
          resources:
            # e2e 璧勬簮璋冨皬
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi